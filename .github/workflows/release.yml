name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: test "v$(node --print 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Check package
        run: npm run check

      - name: Build release archive
        run: npm pack

      - name: Publish npm package
        run: npm publish addon-pass-sdk-*.tgz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" addon-pass-sdk-*.tgz --title "@addon-pass/sdk $GITHUB_REF_NAME" --verify-tag
